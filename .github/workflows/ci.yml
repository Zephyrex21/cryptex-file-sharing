name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

  # A Docker-build job belongs here once the project has a Dockerfile
  # (tracked separately on the roadmap) — deliberately not stubbed in yet,
  # since a CI step referencing a build that doesn't exist would just fail
  # for reasons unrelated to anything this pipeline is meant to catch.
