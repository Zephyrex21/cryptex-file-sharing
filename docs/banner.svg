  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5EEAD4"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
  <radialGradient id="g1"><stop offset="0%" stop-color="#5EEAD4" stop-opacity=".20"/><stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0%" stop-color="#60A5FA" stop-opacity=".18"/><stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
